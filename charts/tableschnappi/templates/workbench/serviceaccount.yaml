{{- if .Values.workbench.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tableschnappi.workbenchServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
{{- if .Values.mlflow.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tableschnappi.workbenchName" . }}-mlflow-integration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "tableschnappi.workbenchServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
- kind: User
  name: {{ .Values.workbench.username | quote }}
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: {{ .Values.rhoai.mlflowIntegrationClusterRole }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if .Values.workbench.grantEdit }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tableschnappi.workbenchName" . }}-edit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "tableschnappi.workbenchServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
- kind: User
  name: {{ .Values.workbench.username | quote }}
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
