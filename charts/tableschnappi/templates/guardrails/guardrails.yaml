{{- if .Values.guardrails.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tableschnappi.fullname" . }}-guardrails-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
data:
  config.yaml: |
    models:
      - type: main
        engine: openai
        # Resolved through the same helpers as every other template. These
        # previously read .Values.rhoai.vllm* directly, which meant anyone
        # configuring the chart the documented way (model.endpoint/model.name)
        # got guardrails pointed at the stale built-in default instead — a
        # predictor in a namespace they do not own.
        model: {{ include "tableschnappi.modelName" . }}
        # The NemoGuardrails CR injects this from the model Secret when the
        # configured endpoint requires authentication. Keeping the token out
        # of this ConfigMap prevents it being exposed to ConfigMap readers.
        api_key_env_var: OPENAI_API_KEY
        parameters:
          base_url: {{ include "tableschnappi.modelEndpoint" . }}/v1
          ssl_verify: false
          {{- if .Values.model.extraBody }}
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
          {{- end }}

    passthrough: true

    # Start the student workshop with no active checks. Keep the service in
    # place so students can enable the policy through its ConfigMap.
    rails:
      input:
        flows: []

  rails.co: |
    define bot refuse to respond
      "I'm here to help with restaurant reservations and menu questions. How can I help you with your visit?"
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: {{ include "tableschnappi.fullname" . }}-guardrails
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
spec:
  # NeMo Guardrails reads this via api_key_env_var above. Use the same model
  # Secret as the assistant so authenticated gateways (including MaaS) work
  # without placing a credential in the ConfigMap.
  env:
    - name: OPENAI_API_KEY
      {{- if include "tableschnappi.modelAuthEnabled" . }}
      valueFrom:
        secretKeyRef:
          name: {{ include "tableschnappi.modelSecretName" . }}
          key: {{ .Values.model.secretKey | quote }}
      {{- else }}
      # The OpenAI-compatible client requires a value; unauthenticated vLLM
      # endpoints ignore it.
      value: EMPTY
      {{- end }}
  nemoConfigs:
    - name: restaurant-rails
      configMaps:
        - {{ include "tableschnappi.fullname" . }}-guardrails-config
      default: true
{{- end }}
