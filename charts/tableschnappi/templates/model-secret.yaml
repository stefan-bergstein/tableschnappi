{{- /*
Created only when the user hands Helm a token directly. If they point at a
Secret they manage themselves (model.existingSecret / rhoai.modelApiKeySecret)
we reference that instead and create nothing, so Helm never takes ownership of
a Secret it did not make.
*/ -}}
{{- if and .Values.model.apiKey (not .Values.model.existingSecret) (not .Values.rhoai.modelApiKeySecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tableschnappi.modelSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.model.secretKey | quote }}: {{ .Values.model.apiKey | quote }}
{{- end }}
